name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./Resty.slnx

      - name: Build
        run: dotnet build ./src/Kx.Resty.csproj -c Release --no-restore

      - name: Test
        run: dotnet test ./tests/Kx.Resty.UnitTests/Kx.Resty.UnitTests.csproj -c Release --no-restore

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifactName: Kx.Resty-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifactName: Kx.Resty-linux-x64
          - os: macos-latest
            rid: osx-x64
            artifactName: Kx.Resty-osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >-
          dotnet publish ./src/Kx.Resty.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:PublishTrimmed=false
          -o ./artifacts/publish/${{ matrix.rid }}

      - name: Create package
        shell: pwsh
        run: |
          $publishDir = Join-Path (Get-Location) "artifacts/publish/${{ matrix.rid }}"
          $packageDir = Join-Path (Get-Location) "artifacts/packages"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $zipPath = Join-Path $packageDir "${{ matrix.artifactName }}.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($publishDir, $zipPath)

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ./artifacts/packages/${{ matrix.artifactName }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ./release-assets/*.zip
